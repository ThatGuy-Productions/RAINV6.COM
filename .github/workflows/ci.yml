name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      # Independent tsc --noEmit: BETA's next build ignores type errors
      # (next.config.ts: typescript.ignoreBuildErrors = true).
      # This step catches real type errors without changing the app's
      # relaxed build config.
      - run: bunx tsc --noEmit

  prisma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma validate
      - run: bunx prisma format --check

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, prisma]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    # Placeholder: always passes until test suite is built.
    # Exists so branch protection can require it without blocking.
    needs: [build]
    steps:
      - run: echo "No test suite yet — placeholder passes. See audit finding #6."
