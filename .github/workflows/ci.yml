name: CI

on:
  push:
    branches: [main, release-candidate]
  pull_request:
    branches: [main, release-candidate]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      # Independent tsc --noEmit: BETA's next build ignores type errors
      # (next.config.ts: typescript.ignoreBuildErrors = true).
      # This step catches real type errors without changing the app's
      # relaxed build config.
      - run: bunx tsc --noEmit

  prisma:
    runs-on: ubuntu-latest
    env:
      # Prisma's SQLite datasource needs a URL even for schema-only CI validation.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma validate
      - run: bunx prisma format --check

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, prisma]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test
