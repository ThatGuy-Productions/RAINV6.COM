name: CI

on:
  push:
    branches: [main, release-candidate]
  pull_request:
    branches: [main, release-candidate]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      # Independent tsc --noEmit: BETA's next build ignores type errors
      # (next.config.ts: typescript.ignoreBuildErrors = true).
      # This step catches real type errors without changing the app's
      # relaxed build config.
      - run: bunx tsc --noEmit

  prisma:
    runs-on: ubuntu-latest
    env:
      # Schema validation targets the canonical production database provider.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rainv6?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma validate
      - run: bunx prisma format

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, prisma]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - run: bun scripts/verify-model-assets.ts
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rainv6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rainv6"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rainv6?schema=public
      RUN_DB_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx prisma generate
      - run: bun run db:migrate:deploy
      - run: bun test
